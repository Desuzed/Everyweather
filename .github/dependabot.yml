version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose:
        patterns: ['androidx.compose*']
      firebase:
        patterns: ['com.google.firebase*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
